apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: superintelligence-prod

bases:
  - ../../base

nameSuffix: -prod

commonLabels:
  environment: production

patchesStrategicMerge:
  - deployment-patch.yaml
  - hpa-patch.yaml

configMapGenerator:
  - name: timeline-api-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=warn
