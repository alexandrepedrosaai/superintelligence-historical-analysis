apiVersion: v1
kind: Service
metadata:
  name: timeline-api
  labels:
    helm.sh/chart: timeline-api-1.0.0
    app.kubernetes.io/name: timeline-api
    app.kubernetes.io/instance: timeline-api
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: LoadBalancer
  ports:
